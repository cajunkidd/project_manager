services:
  postgres:
    image: postgres:16
    container_name: project-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pmuser
      POSTGRES_PASSWORD: pmpass
      POSTGRES_DB: project_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pmuser"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
